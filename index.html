<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Centru Orizontul Speranței</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafafa;
            color: #333333;
        }
        .gallery-item-card {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

    <!-- GALERIE / GALLERY PAGE -->
    <div id="page-gallery" class="tab-content animate-fadeIn">
        <section class="relative py-20 text-center bg-[#004a99] text-white shadow-md">
            <div class="max-w-4xl mx-auto px-6">
                <h1 class="text-4xl md:text-5xl font-extrabold uppercase tracking-wider mb-4" data-i18n="gallery-header-title">
                    Centru Orizontul Speranței
                </h1>
                <p class="text-lg font-light max-w-2xl mx-auto text-blue-100" data-i18n="gallery-header-desc">
                   Descoperă Locația & Facilitățile centrului din Săvăstreni.
                </p>
            </div>
        </section>

        <!-- Interactive filterable segment -->
<section class="max-w-7xl mx-auto px-6 lg:px-8 py-12">
    <div class="flex flex-wrap justify-center gap-3 mb-10">
        <button onclick="filterGallery('toate')" id="filter-btn-toate" class="filter-btn px-5 py-2 font-bold text-xs uppercase tracking-wider rounded-full transition-all border border-[#004a99] bg-[#004a99] text-white shadow-sm cursor-pointer">
            Toate
        </button>
        <button onclick="filterGallery('parter')" id="filter-btn-parter" class="filter-btn px-5 py-2 font-bold text-xs uppercase tracking-wider rounded-full transition-all border border-slate-200 bg-white text-slate-600 hover:border-[#004a99] hover:text-[#004a99] shadow-sm cursor-pointer">
            Parter
        </button>
        <button onclick="filterGallery('etaj-aripa-a')" id="filter-btn-etaj-aripa-a" class="filter-btn px-5 py-2 font-bold text-xs uppercase tracking-wider rounded-full transition-all border border-slate-200 bg-white text-slate-600 hover:border-[#004a99] hover:text-[#004a99] shadow-sm cursor-pointer">
            Etaj - Aripa A
        </button>
        <button onclick="filterGallery('etaj-aripa-b')" id="filter-btn-etaj-aripa-b" class="filter-btn px-5 py-2 font-bold text-xs uppercase tracking-wider rounded-full transition-all border border-slate-200 bg-white text-slate-600 hover:border-[#004a99] hover:text-[#004a99] shadow-sm cursor-pointer">
            Etaj - Aripa B
        </button>
        <button onclick="filterGallery('apartament')" id="filter-btn-apartament" class="filter-btn px-5 py-2 font-bold text-xs uppercase tracking-wider rounded-full transition-all border border-slate-200 bg-white text-slate-600 hover:border-[#004a99] hover:text-[#004a99] shadow-sm cursor-pointer">
            Apartament
        </button>
        <button onclick="filterGallery('exterior')" id="filter-btn-exterior" class="filter-btn px-5 py-2 font-bold text-xs uppercase tracking-wider rounded-full transition-all border border-slate-200 bg-white text-slate-600 hover:border-[#004a99] hover:text-[#004a99] shadow-sm cursor-pointer">
            Exterior
        </button>
    </div>

    <!-- Photos Grid layout container -->
    <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- Conținutul va fi injectat dinamic de scriptul de mai jos -->
    </div>
</section>
    </div>

    <!-- Footer Section -->
    <footer class="bg-slate-900 text-slate-400 py-10 border-t border-slate-800 text-center text-xs">
        <div class="max-w-7xl mx-auto px-6 space-y-4 flex flex-col items-center">
            <!-- Fundatia REGEN Logo in Footer -->
            <div class="mb-2">
                <img src="Regen Logo.webp" alt="Fundația REGEN Logo" class="h-12 w-auto object-contain select-none" />
            </div>
            
            <p id="footer-text">&copy; 2026 Centrul Orizontul Speranței. Toate drepturile rezervate. Un proiect implementat cu dedicare de Fundația REGEN.</p>
        </div>
    </footer>

   <script>
        // Setul de date complet pentru galerie, cu ID-uri unice
        const galleryData = [
            { id: 1, category: 'parter', title: 'Bucatarie', img: 'Bucatarie1.jpg' },
            { id: 2, category: 'parter', title: 'Bucatarie', img: 'Bucatarie2.jpg' },
            { id: 3, category: 'parter', title: 'Sala de mese', img: 'Sala-de-mese-2.jpg' },
            { id: 4, category: 'parter', title: 'Sala de conferinte', img: 'Sala-de-conferinte.jpg' },
            
            { id: 5, category: 'etaj-aripa-a', title: 'Camera 2 Aripa A - Etaj', img: 'Camera2.jpg' },
            { id: 6, category: 'etaj-aripa-a', title: 'Camera 3 Aripa A - Etaj', img: 'Camera3.jpg' },
            { id: 7, category: 'etaj-aripa-a', title: 'Camera 4 Aripa A - Etaj', img: 'Camera4.jpg' },
            { id: 8, category: 'etaj-aripa-a', title: 'Camera 5 Aripa A - Etaj', img: 'Camera5.jpg' },
            
            { id: 9, category: 'etaj-aripa-b', title: 'Camera 6 Aripa B - Etaj', img: 'Camera6.jpg' },
            { id: 10, category: 'etaj-aripa-b', title: 'Camera 7 Aripa B - Etaj', img: 'Camera7.jpg' },
            { id: 11, category: 'etaj-aripa-b', title: 'Camera 8 Aripa B - Etaj', img: 'Camera8.jpg' },
            { id: 12, category: 'etaj-aripa-b', title: 'Camera 9 Aripa B - Etaj', img: 'Camera9.jpg' },
            { id: 13, category: 'etaj-aripa-b', title: 'Camera 10 Aripa B - Etaj', img: 'Camera10.jpg' },
            
            { id: 14, category: 'apartament', title: 'Vedere din apartament', img: 'https://picsum.photos/seed/ap1/600/400' },
            { id: 15, category: 'exterior', title: 'Curtea exterioară', img: 'https://picsum.photos/seed/ext1/600/400' },
        ];

        // Variabile globale pentru navigare prin săgeți
        let currentFilteredList = [];
        let currentIndex = 0;

        function renderGallery(category) {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';

            currentFilteredList = category === 'toate' 
                ? galleryData 
                : galleryData.filter(item => item.category === category);

            currentFilteredList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'gallery-item-card bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-xl border border-slate-100 flex flex-col';
                card.innerHTML = `
                    <div class="overflow-hidden h-52 bg-slate-100 cursor-pointer" onclick="openLightbox(${index})">
                        <img src="${item.img}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-500 hover:scale-105">
                    </div>
                    <div class="p-4 flex-1 flex items-center justify-center text-center">
                        <p class="text-sm font-medium text-slate-700">${item.title}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterGallery(category) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-[#004a99]', 'text-white', 'border-[#004a99]');
                btn.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
            });

            const activeBtn = document.getElementById(`filter-btn-${category}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-white', 'text-slate-600', 'border-slate-200');
                activeBtn.classList.add('bg-[#004a99]', 'text-white', 'border-[#004a99]');
            }

            renderGallery(category);
        }

        function openLightbox(index) {
            currentIndex = index;
            updateLightboxContent();
            
            const modal = document.getElementById('lightbox-modal');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const modal = document.getElementById('lightbox-modal');
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function changeImage(direction) {
            currentIndex += direction;
            
            if (currentIndex < 0) {
                currentIndex = currentFilteredList.length - 1;
            } else if (currentIndex >= currentFilteredList.length) {
                currentIndex = 0;
            }
            
            updateLightboxContent();
        }

        function updateLightboxContent() {
            const item = currentFilteredList[currentIndex];
            const modalImg = document.getElementById('lightbox-img');
            const modalTitle = document.getElementById('lightbox-title');
            
            modalImg.src = item.img;
            modalImg.alt = item.title;
            modalTitle.textContent = item.title;
        }

        // Suport pentru tastele Săgeți și ESC
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('lightbox-modal');
            if (!modal.classList.contains('hidden')) {
                if (e.key === 'ArrowLeft') changeImage(-1);
                if (e.key === 'ArrowRight') changeImage(1);
                if (e.key === 'Escape') closeLightbox();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderGallery('toate');
        });
    </script>

   <!-- Lightbox Modal cu imagine mărită și săgeți integrate -->
<div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/95 hidden flex items-center justify-center p-2 md:p-6">
    <!-- Buton Închidere -->
    <button onclick="closeLightbox()" class="absolute top-4 right-4 md:top-6 md:right-6 text-white text-4xl font-bold hover:text-slate-300 z-50 cursor-pointer">&times;</button>
    
    <!-- Săgeata Stânga (Poziționată pe mijloc, în stânga imaginii) -->
    <button onclick="changeImage(-1)" class="absolute left-2 md:left-6 top-1/2 -translate-y-1/2 text-white bg-white/10 hover:bg-white/20 p-3 md:p-4 rounded-full text-xl md:text-2xl font-bold transition-all z-50 cursor-pointer">
        &#10094;
    </button>

    <!-- Container pentru imagine și titlu (ocupă mult mai mult din ecran) -->
    <div class="flex flex-col items-center justify-center max-w-[92vw] max-h-[95vh] px-12">
        <img id="lightbox-img" class="max-w-[85vw] max-h-[82vh] object-contain rounded-lg shadow-2xl" alt="Imagine mărită">
        <p id="lightbox-title" class="text-white mt-3 text-sm md:text-base font-medium tracking-wide text-center"></p>
    </div>

    <!-- Săgeata Dreapta (Poziționată pe mijloc, în dreapta imaginii) -->
    <button onclick="changeImage(1)" class="absolute right-2 md:right-6 top-1/2 -translate-y-1/2 text-white bg-white/10 hover:bg-white/20 p-3 md:p-4 rounded-full text-xl md:text-2xl font-bold transition-all z-50 cursor-pointer">
        &#10095;
    </button>
</div>
</body>
</html>
